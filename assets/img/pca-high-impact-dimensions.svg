y="Arial,sans-serif" font-size="18" font-weight="700" fill="#24484b">67%</text><text x="55" y="378" font-family="Arial,sans-serif" font-size="19" fill="#263d45">Assets</text><rect x="240" y="357" width="650" height="30" rx="7" fill="#e4ede8"/><rect x="240" y="357" width="374.1" height="30" rx="7" fill="#2b8279"/><text x="627.1" y="379" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24484b">58%</text><text x="55" y="437" font-family="Arial,sans-serif" font-size="19" fill="#263d45">Social</text><rect x="240" y="416" width="650" height="30" rx="7" fill="#e4ede8"/><rect x="240" y="416" width="290.2" height="30" rx="7" fill="#2b8279"/><text x="543.2" y="438" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#24484b">45%</text><text x="55" y="478" font-family="Arial,sans-serif" font-size="13" fill="#596e70">Source: working paper, Table 2. Categories reflect its index threshold and sampled respondents, not district-wide prevalence.</text></svg>