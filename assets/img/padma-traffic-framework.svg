<g stroke="#9ba9a8" stroke-width="3"><line x1="175" y1="285" x2="260" y2="355"/><line x1="260" y1="355" x2="320" y2="525"/><line x1="145" y1="505" x2="320" y2="525"/><line x1="860" y1="300" x2="1010" y2="390"/><line x1="860" y1="300" x2="850" y2="510"/><line x1="850" y1="510" x2="1030" y2="530"/><line x1="1010" y1="390" x2="1030" y2="530"/><line x1="260" y1="355" x2="500" y2="405"/><line x1="692" y1="405" x2="860" y2="300"/><line x1="320" y1="525" x2="500" y2="405"/><line x1="692" y1="405" x2="850" y2="510"/></g>
