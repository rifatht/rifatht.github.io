<rect x="90" y="548" width="236" height="58" rx="16" fill="#eef2f1" stroke="#cbd4cf"/><text x="110" y="571" font-size="11" font-weight="800" fill="#2f766f" letter-spacing="1">NO-BRIDGE ESTIMATE</text><text x="110" y="594" font-size="20" font-weight="700" fill="#10212b">8,052 vehicles/day</text>
<rect x="341" y="548" width="236" height="58" rx="16" fill="#eef2f1" stroke="#cbd4cf"/><text x="361" y="571" font-size="11" font-weight="800" fill="#2f766f" letter-spacing="1">OBSERVED TRAFFIC</text><text x="361" y="594" font-size="20" font-weight="700" fill="#10212b">20,240 vehicles/day</text>
