<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">Padma Bridge traffic counterfactual framework</title>
<desc id="desc">A research framework showing observed bridge traffic, a no-bridge counterfactual, behavioural attribution and scenario forecasting.</desc>
<rect width="1200" height="700" fill="#f8f6ef"/>
<text x="62" y="58" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#2f766f" letter-spacing="2">MURP DISSERTATION · SUBMITTED JULY 2026</text>
<text x="62" y="104" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="650" fill="#10212b">Padma Bridge traffic: observed vs no-bridge counterfactual</text>
<text x="62" y="136" font-family="Inter, Arial, sans-serif" font-size="17" fill="#607179">Mixed-methods transport analysis with uncertainty and behavioural interpretation</text>
<rect x="62" y="184" width="1076" height="442" rx="24" fill="#fffdfa" stroke="#cbd4cf"/>

